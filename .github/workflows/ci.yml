name: CI

# Controlled checks only. This workflow never receives credentials and
# never reaches a marketplace: `tests/live/**` stays gated behind
# LIVE_MARKETPLACE_TESTS, which is deliberately not set anywhere here.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests/__init__.py supplies deterministic settings under this flag, so
  # the suite needs no .env and no real database.
  PYTHON_DOTENV_DISABLED: '1'

jobs:
  tests:
    name: Controlled test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # tests/test_browser_source_limits.py executes the in-page Ozon
      # fetch JavaScript through a real node process and skips itself when
      # node is missing. Installing it here keeps that contract coverage
      # from disappearing silently.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm node is available for the in-page contract tests
        run: node --version

      - name: Install the main runtime requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scoped to the marketplace/browser workstream: the older parts of
      # the tree still carry unrelated style debt.
      - name: Style
        run: |
          python -m flake8 \
            src/browser src/captcha src/marketplaces src/ozon src/wb \
            scripts tests
          python -m pycodestyle \
            src/browser src/captcha src/marketplaces \
            scripts/verify_compose.py tests/test_compose_policy.py

      - name: Repository hygiene
        run: python scripts/repository_hygiene.py --format json

      - name: Unit and controlled tests
        run: python -m unittest discover -s tests -t . -v

      - name: Compose policy
        run: |
          python scripts/verify_compose.py \
            docker-compose.yml docker-compose.production.yml
          python scripts/verify_compose.py \
            docker-compose.yml docker-compose.local.yml

  images:
    name: Browser image build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The images download Chromium and Google Chrome, so a rendered
      # policy check is not enough: they have to actually build.
      - name: Build the API and bot images
        run: |
          docker compose \
            -f docker-compose.yml -f docker-compose.local.yml \
            build api bot

      - name: Confirm both images end as a non-root user
        run: |
          for service in api bot; do
            uid="$(docker compose \
              -f docker-compose.yml -f docker-compose.local.yml \
              run --rm --no-deps --entrypoint id "$service" -u \
              | tr -d '\r')"
            echo "$service runs as uid $uid"
            test "$uid" = "10001"
          done
