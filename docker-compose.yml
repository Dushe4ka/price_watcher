version: '3.9'

volumes:
  pg_data:
  static:
  ozon_profile:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/media
      - ./config:/app/config:ro
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    container_name: telegram_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static:/app/media
      - ./config:/app/config:ro
      - ozon_profile:/app/.ozon-profile
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - api
  db:
    image: postgres:15-alpine
    container_name: db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 10
